<rect width="1180" height="1010" fill="#ffffff"/>
<text x="590.0" y="14" text-anchor="middle" style="font-size:15px;font-weight:bold;fill:#222">The ImagesAnnotator dependencies</text>
<rect x="20" y="20" width="1140" height="210" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="32" y="40" class="pkg">The application</text>
<rect x="60" y="52" width="440" height="97" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="474" y="60" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="470" y="62" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="470" y="68" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="74" y="71" class="cname">ImagesAnnotator</text>
<text x="74" y="85" class="sub">the annotator application</text>
<line x1="60" y1="95" x2="500" y2="95" stroke="#3a3a3a" stroke-width="1"/>
<text x="70" y="109" class="member">the annotator business logic (AnnotatorController)</text>
<text x="70" y="124" class="member">the events bus (ImagesAnnotatorEventController)</text>
<text x="70" y="139" class="member">four interchangeable GUI implementations</text>
<rect x="620" y="52" width="480" height="97" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="1074" y="60" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="1070" y="62" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="1070" y="68" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="634" y="71" class="cname">GUI toolkit</text>
<text x="634" y="85" class="sub">GTKmm3 | GTKmm4 | Qt6 | wxWidgets</text>
<line x1="620" y1="95" x2="1100" y2="95" stroke="#3a3a3a" stroke-width="1"/>
<text x="630" y="109" class="member">exactly one is compiled in, picked at configure time</text>
<text x="630" y="124" class="member">implements IImageCropperFacility  (the export side)</text>
<text x="630" y="139" class="member">implements IImageSizeFacility     (the import side)</text>
<rect x="20" y="260" width="1140" height="380" rx="4" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="32" y="280" class="pkg">The ImagesAnnotator libraries</text>
<rect x="60" y="292" width="440" height="97" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="474" y="300" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="470" y="302" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="470" y="308" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="74" y="311" class="cname">ImagesAnnotator-DataExporters</text>
<text x="74" y="325" class="sub">ImagesAnnotatorDataExporters011</text>
<line x1="60" y1="335" x2="500" y2="335" stroke="#3a3a3a" stroke-width="1"/>
<text x="70" y="349" class="member">writes nine dataset layouts out of a project</text>
<text x="70" y="364" class="member">declares IImageCropperFacility</text>
<text x="70" y="379" class="member">own OpenCV cropper in a build which found it</text>
<rect x="620" y="292" width="480" height="97" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="1074" y="300" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="1070" y="302" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="1070" y="308" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="634" y="311" class="cname">ImagesAnnotator-DataImporters</text>
<text x="634" y="325" class="sub">ImagesAnnotatorDataImporters013</text>
<line x1="620" y1="335" x2="1100" y2="335" stroke="#3a3a3a" stroke-width="1"/>
<text x="630" y="349" class="member">reads three dataset layouts back into a project</text>
<text x="630" y="364" class="member">declares IImageSizeFacility</text>
<text x="630" y="379" class="member">own OpenCV size reader in a build which found it</text>
<rect x="300" y="492" width="560" height="82" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="834" y="500" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="830" y="502" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="830" y="508" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="314" y="511" class="cname">ImagesAnnotator-DataDrivers</text>
<text x="314" y="525" class="sub">ImagesAnnotatorDataDrivers011</text>
<line x1="300" y1="535" x2="860" y2="535" stroke="#3a3a3a" stroke-width="1"/>
<text x="310" y="549" class="member">the project JSON database: parsing, merging, storing</text>
<text x="310" y="564" class="member">the ImageRecord / ImageRecordRect value types</text>
<rect x="20" y="670" width="1140" height="250" rx="4" fill="#eeeeee" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="32" y="690" class="pkg">Third party</text>
