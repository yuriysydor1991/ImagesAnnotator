<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1200" viewBox="0 0 1180 1200">
<defs>
  <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
    <path d="M 0 0 L 10 4 L 0 8" fill="none" stroke="#3a3a3a" stroke-width="1.3"/>
  </marker>
</defs>
<style>
  text { font-family: "DejaVu Sans", Verdana, sans-serif; fill: #1a1a1a; }
  .pkg { font-size: 14px; font-weight: bold; fill: #333333; }
  .cname { font-size: 13px; font-weight: bold; }
  .sub { font-size: 10.5px; fill: #555555; font-family: "DejaVu Sans Mono", monospace; }
  .member { font-size: 11px; font-family: "DejaVu Sans Mono", monospace; }
  .edge { font-size: 10px; fill: #444444; }
  .note { font-size: 11px; fill: #4a4300; }
</style>
<rect x="0" y="0" width="1180" height="1200" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="590.0" y="14" text-anchor="middle" style="font-size:15px;font-weight:bold;fill:#222">The ImagesAnnotator dependencies</text>
<rect x="20" y="20" width="1140" height="340" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="32" y="40" class="pkg">The application</text>
<rect x="60" y="52" width="440" height="97" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="474" y="60" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="470" y="62" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="470" y="68" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="74" y="71" class="cname">ImagesAnnotator</text>
<text x="74" y="85" class="sub">the annotator application</text>
<line x1="60" y1="95" x2="500" y2="95" stroke="#3a3a3a" stroke-width="1"/>
<text x="70" y="109" class="member">the annotator business logic (AnnotatorController)</text>
<text x="70" y="124" class="member">the events bus (ImagesAnnotatorEventController)</text>
<text x="70" y="139" class="member">four interchangeable GUI implementations</text>
<rect x="620" y="52" width="480" height="97" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="1074" y="60" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="1070" y="62" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="1070" y="68" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="634" y="71" class="cname">GUI toolkit</text>
<text x="634" y="85" class="sub">GTKmm3 | GTKmm4 | Qt6 | wxWidgets</text>
<line x1="620" y1="95" x2="1100" y2="95" stroke="#3a3a3a" stroke-width="1"/>
<text x="630" y="109" class="member">exactly one is compiled in, picked at configure time</text>
<text x="630" y="124" class="member">implements IImageCropperFacility  (the export side)</text>
<text x="630" y="139" class="member">implements IImageSizeFacility     (the import side)</text>
<rect x="300" y="195" width="560" height="112" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="834" y="203" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="830" y="205" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="830" y="211" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="314" y="214" class="cname">ImagesAnnotatorConverter</text>
<text x="314" y="228" class="sub">the converter only binary</text>
<line x1="300" y1="238" x2="860" y2="238" stroke="#3a3a3a" stroke-width="1"/>
<text x="310" y="252" class="member">the very same components, with no GUI toolkit at all</text>
<text x="310" y="267" class="member">implements neither facility of the two libraries, so their</text>
<text x="310" y="282" class="member">own OpenCV ones are the only implementations it has:</text>
<text x="310" y="297" class="member">OpenCV is REQUIRED for this binary, not optional</text>
<rect x="20" y="410" width="1140" height="380" rx="4" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="32" y="430" class="pkg">The ImagesAnnotator libraries</text>
<rect x="60" y="442" width="440" height="97" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="474" y="450" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="470" y="452" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="470" y="458" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="74" y="461" class="cname">ImagesAnnotator-DataExporters</text>
<text x="74" y="475" class="sub">ImagesAnnotatorDataExporters013</text>
<line x1="60" y1="485" x2="500" y2="485" stroke="#3a3a3a" stroke-width="1"/>
<text x="70" y="499" class="member">writes thirteen dataset layouts out of a project</text>
<text x="70" y="514" class="member">declares IImageCropperFacility</text>
<text x="70" y="529" class="member">own OpenCV cropper in a build which found it</text>
<rect x="620" y="442" width="480" height="97" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="1074" y="450" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="1070" y="452" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="1070" y="458" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="634" y="461" class="cname">ImagesAnnotator-DataImporters</text>
<text x="634" y="475" class="sub">ImagesAnnotatorDataImporters015</text>
<line x1="620" y1="485" x2="1100" y2="485" stroke="#3a3a3a" stroke-width="1"/>
<text x="630" y="499" class="member">reads thirteen dataset layouts back into a project</text>
<text x="630" y="514" class="member">declares IImageSizeFacility</text>
<text x="630" y="529" class="member">own OpenCV size reader in a build which found it</text>
<rect x="300" y="642" width="560" height="97" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="834" y="650" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="830" y="652" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="830" y="658" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="314" y="661" class="cname">ImagesAnnotator-DataDrivers</text>
<text x="314" y="675" class="sub">ImagesAnnotatorDataDrivers013</text>
<line x1="300" y1="685" x2="860" y2="685" stroke="#3a3a3a" stroke-width="1"/>
<text x="310" y="699" class="member">the project database: parsing, merging, storing</text>
<text x="310" y="714" class="member">of the JSON and the gzip compressed imgajz1 files</text>
<text x="310" y="729" class="member">the ImageRecord / ImageRecordRect value types</text>
<rect x="20" y="820" width="1140" height="250" rx="4" fill="#eeeeee" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="32" y="840" class="pkg">Third party</text>
<rect x="60" y="852" width="190" height="53" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="224" y="860" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="220" y="862" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="220" y="868" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="74" y="871" class="cname">libcurl</text>
<line x1="60" y1="881" x2="250" y2="881" stroke="#3a3a3a" stroke-width="1"/>
<text x="70" y="895" class="member">HTTP and the CURLU URL API</text>
<rect x="280" y="852" width="250" height="53" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="504" y="860" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="500" y="862" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="500" y="868" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="294" y="871" class="cname">nlohmann/json</text>
<line x1="280" y1="881" x2="530" y2="881" stroke="#3a3a3a" stroke-width="1"/>
<text x="290" y="895" class="member">the project file parser and writer</text>
<rect x="560" y="852" width="190" height="68" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="724" y="860" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="720" y="862" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="720" y="868" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="574" y="871" class="cname">zlib</text>
<line x1="560" y1="881" x2="750" y2="881" stroke="#3a3a3a" stroke-width="1"/>
<text x="570" y="895" class="member">gzip: the darknetxx files,</text>
<text x="570" y="910" class="member">the imgajz1 project files</text>
<rect x="780" y="852" width="320" height="82" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="1074" y="860" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="1070" y="862" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="1070" y="868" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="794" y="871" class="cname">OpenCV</text>
<text x="794" y="885" class="sub">core, imgcodecs</text>
<line x1="780" y1="895" x2="1100" y2="895" stroke="#3a3a3a" stroke-width="1"/>
<text x="790" y="909" class="member">optional for the ImagesAnnotator binary</text>
<text x="790" y="924" class="member">REQUIRED for ImagesAnnotatorConverter</text>
<rect x="420" y="980" width="300" height="53" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="694" y="988" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="690" y="990" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="690" y="996" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="434" y="999" class="cname">GoogleTest / GoogleMock</text>
<line x1="420" y1="1009" x2="720" y2="1009" stroke="#3a3a3a" stroke-width="1"/>
<text x="430" y="1023" class="member">the suites of all four projects</text>
<path d="M 500 80 L 620 80" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="560" y="74" class="edge" text-anchor="middle">compiles one of</text>
<path d="M 380 149 L 380 195" fill="none" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#open)"/>
<text x="388" y="166" class="edge" text-anchor="start">built out of the</text>
<text x="388" y="178" class="edge" text-anchor="start">same components</text>
<path d="M 160 149 L 160 442" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="168" y="290" class="edge" text-anchor="start">export</text>
<text x="168" y="302" class="edge" text-anchor="start">requests</text>
<path d="M 260 149 L 260 385 L 860 385 L 860 442" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="620" y="379" class="edge" text-anchor="middle">import requests</text>
<path d="M 60 100 L 36 100 L 36 683 L 300 683" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="44" y="703" class="edge" text-anchor="start">opens and stores the project</text>
<path d="M 60 125 L 24 125 L 24 878 L 60 878" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="46" y="620" class="edge" text-anchor="start">loads web hosted images</text>
<path d="M 940 149 L 940 340 L 240 340 L 240 442" fill="none" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#open)"/>
<text x="590" y="334" class="edge" text-anchor="middle">implements</text>
<path d="M 1000 149 L 1000 442" fill="none" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#open)"/>
<text x="1008" y="300" class="edge" text-anchor="start">implements</text>
<path d="M 860 250 L 1140 250 L 1140 880 L 1100 880" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="1132" y="595" class="edge" text-anchor="end">REQUIRED,</text>
<text x="1132" y="607" class="edge" text-anchor="end">in both libraries</text>
<path d="M 360 539 L 360 642" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="368" y="595" class="edge" text-anchor="start">PUBLIC</text>
<path d="M 800 539 L 800 642" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="808" y="627" class="edge" text-anchor="start">PUBLIC</text>
<path d="M 160 539 L 160 852" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="168" y="750" class="edge" text-anchor="start">PRIVATE</text>
<path d="M 460 539 L 460 565 L 940 565 L 940 852" fill="none" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#open)"/>
<text x="700" y="559" class="edge" text-anchor="middle">PRIVATE, optional *</text>
<path d="M 1000 539 L 1000 852" fill="none" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#open)"/>
<text x="1008" y="680" class="edge" text-anchor="start">PRIVATE,</text>
<text x="1008" y="692" class="edge" text-anchor="start">optional *</text>
<path d="M 405 739 L 405 852" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="413" y="795" class="edge" text-anchor="start">PRIVATE</text>
<path d="M 320 739 L 320 805 L 220 805 L 220 852" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="312" y="799" class="edge" text-anchor="end">PRIVATE, the URL API only</text>
<path d="M 620 739 L 620 852" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="628" y="771" class="edge" text-anchor="start">PRIVATE, the imgajz1</text>
<text x="628" y="783" class="edge" text-anchor="start">project files</text>
<path d="M 440 539 L 440 590 L 880 590" fill="none" stroke="#3a3a3a" stroke-width="1.3"/>
<path d="M 880 539 L 880 805 L 710 805 L 710 852" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="620" y="606" class="edge" text-anchor="middle">PRIVATE, the darknetxx files</text>
<rect x="20" y="1078" width="1140" height="106" rx="4" fill="#fffbe6" stroke="#b8a54a" stroke-width="1.1"/>
<text x="34" y="1096" class="note">The three ImagesAnnotator libraries are consumed installed: none is fetched by a configure of this project and none is a</text>
<text x="34" y="1111" class="note">distribution package - misc/ci/install-annotator-libraries.sh builds and installs all three. A PUBLIC link is one whose usage</text>
<text x="34" y="1126" class="note">requirements reach this project as well, which is why the installable headers of both sibling libraries may name the data drivers types.</text>
<text x="34" y="1141" class="note">Solid arrow: a mandatory dependency. Dashed arrow: an optional one, or an interface this project implements for the library.</text>
<text x="34" y="1156" class="note">* OpenCV is optional for the ImagesAnnotator binary, whose GUI toolkit implements both facilities, and required for the</text>
<text x="34" y="1171" class="note">ImagesAnnotatorConverter one, which starts no toolkit: the OpenCV cropper and size reader of the two libraries are all it has.</text>
</svg>
