<rect x="334" y="710" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="330" y="712" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="330" y="718" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="74" y="721" class="cname">libcurl</text>
<line x1="60" y1="731" x2="360" y2="731" stroke="#3a3a3a" stroke-width="1"/>
<text x="70" y="745" class="member">HTTP and the CURLU URL API</text>
<rect x="420" y="702" width="300" height="53" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="694" y="710" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="690" y="712" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="690" y="718" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="434" y="721" class="cname">nlohmann/json</text>
<line x1="420" y1="731" x2="720" y2="731" stroke="#3a3a3a" stroke-width="1"/>
<text x="430" y="745" class="member">the project file parser and writer</text>
<rect x="780" y="702" width="320" height="67" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="1074" y="710" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="1070" y="712" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="1070" y="718" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="794" y="721" class="cname">OpenCV</text>
<text x="794" y="735" class="sub">core, imgcodecs</text>
<line x1="780" y1="745" x2="1100" y2="745" stroke="#3a3a3a" stroke-width="1"/>
<text x="790" y="759" class="member">optional in both libraries</text>
<rect x="420" y="830" width="300" height="53" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="694" y="838" width="18" height="12" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="690" y="840" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<rect x="690" y="846" width="8" height="3.5" fill="#fdfdf6" stroke="#3a3a3a" stroke-width="1"/>
<text x="434" y="849" class="cname">GoogleTest / GoogleMock</text>
<line x1="420" y1="859" x2="720" y2="859" stroke="#3a3a3a" stroke-width="1"/>
<text x="430" y="873" class="member">the suites of all four projects</text>
<path d="M 500 80 L 620 80" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="560" y="74" class="edge" text-anchor="middle">compiles one of</text>
<path d="M 160 149 L 160 292" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="168" y="205" class="edge" text-anchor="start">export</text>
<text x="168" y="217" class="edge" text-anchor="start">requests</text>
<path d="M 400 149 L 400 245 L 860 245 L 860 292" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="630" y="239" class="edge" text-anchor="middle">import requests</text>
<path d="M 60 100 L 36 100 L 36 540 L 300 540" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="44" y="560" class="edge" text-anchor="start">opens and stores the project</text>
<path d="M 60 125 L 24 125 L 24 740 L 60 740" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="46" y="500" class="edge" text-anchor="start">loads web hosted images</text>
<path d="M 660 149 L 660 268 L 300 268 L 300 292" fill="none" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#open)"/>
<text x="480" y="262" class="edge" text-anchor="middle">implements</text>
<path d="M 700 149 L 700 292" fill="none" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#open)"/>
<text x="708" y="210" class="edge" text-anchor="start">implements</text>
<path d="M 360 389 L 360 492" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="368" y="445" class="edge" text-anchor="start">PUBLIC</text>
<path d="M 800 389 L 800 492" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="808" y="445" class="edge" text-anchor="start">PUBLIC</text>
<path d="M 160 389 L 160 702" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="168" y="610" class="edge" text-anchor="start">PRIVATE</text>
<path d="M 460 389 L 460 415 L 940 415 L 940 702" fill="none" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#open)"/>
<text x="700" y="409" class="edge" text-anchor="middle">PRIVATE, optional</text>
<path d="M 1000 389 L 1000 702" fill="none" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#open)"/>
<text x="1008" y="530" class="edge" text-anchor="start">PRIVATE,</text>
<text x="1008" y="542" class="edge" text-anchor="start">optional</text>
<path d="M 570 574 L 570 702" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="578" y="645" class="edge" text-anchor="start">PRIVATE</text>
<path d="M 340 574 L 340 655 L 240 655 L 240 702" fill="none" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#open)"/>
<text x="332" y="649" class="edge" text-anchor="end">PRIVATE, the URL API only</text>
<rect x="20" y="928" width="1140" height="76" rx="4" fill="#fffbe6" stroke="#b8a54a" stroke-width="1.1"/>
<text x="34" y="946" class="note">The three ImagesAnnotator libraries are consumed installed: none is fetched by a configure of this project and none is a</text>
<text x="34" y="961" class="note">distribution package - misc/ci/install-annotator-libraries.sh builds and installs all three. A PUBLIC link is one whose usage</text>
<text x="34" y="976" class="note">requirements reach this project as well, which is why the installable headers of both sibling libraries may name the data drivers types.</text>
<text x="34" y="991" class="note">Solid arrow: a mandatory dependency. Dashed arrow: an optional one, or an interface this project implements for the library.</text>
</svg>
